name: Deploy to CloudBase

on:
  push:
    branches:
      - main          # main 分支有更新就自动部署
  workflow_dispatch:   # 也支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: 校验密钥格式
        env:
          ID: ${{ secrets.TCB_SECRET_ID }}
        run: |
          case "$ID" in
            AKID*) echo "✅ SecretId 前缀正确" ;;
            *) echo "❌ SecretId 前缀不是 AKID"; exit 1 ;;
          esac

      - name:  Deploy to CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: 部署静态托管
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: tcb hosting deploy ./ -e "$TCB_ENV_ID"
